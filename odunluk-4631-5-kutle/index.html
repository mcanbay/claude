<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odunluk 4631/5 Kütle</title>
<style>
  :root {
    --bg-top: #dfe7ef; --bg-bottom: #f4f2ee; --ink: #23262b; --muted: #6b7078;
    --panel: rgba(255,255,255,0.86); --line: rgba(35,38,43,0.14); --accent: #b4542f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --panel: rgba(28,30,34,0.86); --ink: #eceae6; --muted: #a3a7ad; --line: rgba(236,234,230,0.16); }
  }
  :root[data-theme="dark"] { --panel: rgba(28,30,34,0.86); --ink: #eceae6; --muted: #a3a7ad; --line: rgba(236,234,230,0.16); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e9edf1; font-family: "DejaVu Sans", "Liberation Sans", system-ui, sans-serif; color: var(--ink); }
  #sahne { position: fixed; inset: 0; }
  canvas { display: block; }
  .katman { position: fixed; inset: 0; pointer-events: none; }
  .baslik { position: fixed; left: 24px; bottom: 20px; color: #23262b; pointer-events: none; background: rgba(255,255,255,0.84); border-radius: 6px; padding: 9px 13px; }
  .baslik .ust { font-size: 13px; letter-spacing: 0.18em; font-weight: 700; }
  .baslik .alt { font-size: 12px; letter-spacing: 0.06em; color: #5d636b; margin-top: 4px; }
  .kuzey { position: fixed; right: 30px; top: 26px; width: 54px; height: 54px; pointer-events: none; }
  .etiket { position: absolute; font-size: 12px; color: #23262b; white-space: nowrap; transform: translate(-100%, -50%); padding-right: 10px; }
  .etiket b { font-weight: 700; letter-spacing: 0.08em; }
  .etiket span { color: #5d636b; margin-left: 6px; }
  .lejant { position: fixed; left: 28px; top: 24px; background: rgba(255,255,255,0.88); border: 1px solid rgba(35,38,43,0.12); border-radius: 6px; padding: 12px 14px; font-size: 12px; color: #23262b; line-height: 1.6; pointer-events: none; }
  .lejant i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 8px; vertical-align: -1px; }
  .lejant .not { color: #5d636b; font-size: 11px; margin-top: 6px; }
  .arac { position: fixed; left: 16px; top: 16px; right: 16px; display: flex; gap: 6px; pointer-events: auto; overflow-x: auto; scrollbar-width: none; }
  .arac::-webkit-scrollbar { display: none; }
  .arac button { flex: 0 0 auto; white-space: nowrap; }
  body.ui .lejant { top: 64px; }
  .arac button { font: inherit; font-size: 13px; padding: 7px 11px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; backdrop-filter: blur(6px); }
  .arac button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  @media (max-width: 640px) { .baslik { left: 12px; bottom: 12px; } .lejant { left: 16px; top: 64px; font-size: 11px; } .kuzey { right: 16px; top: auto; bottom: 16px; width: 40px; height: 40px; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="sahne"></div>
<div class="katman" id="etiketler"></div>
<svg class="kuzey" id="kuzey" viewBox="-30 -30 60 60" aria-label="Kuzey">
  <g id="kuzeyOk"><circle r="26" fill="rgba(255,255,255,0.85)" stroke="#23262b" stroke-width="1.2"/>
  <path d="M0,-20 L7,8 L0,3 L-7,8 Z" fill="#23262b"/><text y="21" text-anchor="middle" font-size="10" font-weight="700" fill="#23262b">K</text></g>
</svg>
<div class="baslik" id="baslik"><div class="ust">ODUNLUK · 4631 ADA 5 PARSEL</div><div class="alt" id="altBaslik">Kütle çalışması</div></div>
<div class="lejant" id="lejant" hidden></div>
<div class="arac" id="arac" hidden></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { sahneKur, etiketNoktalari, KOT } from './kutle.js';

const q = new URLSearchParams(location.search);
const MOD = q.get('mod') || 'render';
const UI = q.get('ui') !== '0';
// ortam kapatma (AO): render modunda açık; etkileşimli görüntüleyicide ?ao=1 ile açılır
let AO = q.has('ao') ? q.get('ao') !== '0' : !UI;

// Kamera görünüşleri (dünya metre; X doğu, Z güney)
const GORUNUS = {
  kuzeydogu: { ad: 'Kuzeydoğu kuşbakışı · 706. Sokak – Odunluk Caddesi köşesi', poz: [33, 17, -36], hedef: [-3, 5, 0], fov: 37, gunes: [72, 24] },
  sokak:     { ad: '706. Sokak cephesi (kuzey)', poz: [-0.6, 5.2, -41], hedef: [-0.6, 5.6, 0], fov: 44, gunes: [66, 22] },
  kose:      { ad: '706. Sokak\'tan yaya bakışı', poz: [21, 1.7, -19], hedef: [-6, 6.2, -3], fov: 56, gunes: [70, 24] },
  guneybati: { ad: 'Güneybatı kuşbakışı', poz: [-40, 28, 40], hedef: [-3, 3.5, 0.5], fov: 34, gunes: [235, 36] },
  vaziyet:   { ad: 'Vaziyet (üstten)', ust: true, gunes: [225, 64], ortam: 0.75 },
  diyagram:  { ad: 'Kullanım şeması', poz: [-44, 27, -36], hedef: [-5, 4, 7], fov: 35, gunes: [300, 34] },
};
if (q.get('kam')) GORUNUS.ozel = { ad: 'Özel', poz: q.get('kam').split(',').map(Number), hedef: (q.get('hedef') || '0,4,0').split(',').map(Number), fov: Number(q.get('fov') || 30), gunes: (q.get('gunes') || '62,30').split(',').map(Number) };
const viewKey = q.get('kam') ? 'ozel' : (q.get('gorunus') || (MOD === 'diyagram' ? 'diyagram' : 'kuzeydogu'));

// --- renderer
const kap = document.getElementById('sahne');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.outputColorSpace = THREE.SRGBColorSpace;
kap.appendChild(renderer.domElement);

const scene = new THREE.Scene();

// --- gökyüzü degrade arka plan + yansıma ortamı
function degrade(w, h, duraklar) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); const g = x.createLinearGradient(0, 0, 0, h);
  for (const [o, r] of duraklar) g.addColorStop(o, r);
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
// gökyüzü kubbesi: ufuk rengi sis rengiyle aynı, böylece zemin ufukta yumuşakça kaybolur
const UFUK = new THREE.Color(0xedeeee);
scene.background = UFUK.clone();
const kubbe = new THREE.Mesh(new THREE.SphereGeometry(1200, 48, 24), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { ufuk: { value: UFUK }, zenit: { value: new THREE.Color(0x8fb0d0) } },
  vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader: 'uniform vec3 ufuk; uniform vec3 zenit; varying vec3 vP; void main(){ float h = clamp(vP.y, 0.0, 1.0); gl_FragColor = vec4(mix(ufuk, zenit, smoothstep(0.0, 0.55, pow(h, 0.8))), 1.0); }',
}));
kubbe.renderOrder = -1; kubbe.frustumCulled = false;
scene.add(kubbe);

const ortam = new THREE.Scene();
{
  const gok = new THREE.Mesh(new THREE.SphereGeometry(100, 48, 24), new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms: {},
    vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader: `varying vec3 vP; void main(){
      float h = vP.y;
      vec3 zenit = vec3(0.36,0.52,0.72), ufuk = vec3(0.93,0.94,0.95), yer = vec3(0.42,0.40,0.37);
      vec3 c = h > 0.0 ? mix(ufuk, zenit, pow(h, 0.6)) : mix(ufuk, yer, pow(-h, 0.35));
      gl_FragColor = vec4(c, 1.0); }`,
  }));
  ortam.add(gok);
}
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(ortam, 0.02).texture;

// --- ışık
const gok = new THREE.HemisphereLight(0xdfe9f4, 0xbdb4a6, 0.35);
scene.add(gok);
const gunes = new THREE.DirectionalLight(0xfff1dc, 3.7);
gunes.castShadow = true;
gunes.shadow.mapSize.set(4096, 4096);
const sc = gunes.shadow.camera; sc.left = -52; sc.right = 52; sc.top = 52; sc.bottom = -52; sc.near = 1; sc.far = 260;
gunes.shadow.bias = -0.0004; gunes.shadow.normalBias = 0.03; gunes.shadow.radius = 3;
scene.add(gunes, gunes.target);
function gunesAyarla([az, el]) {
  const a = THREE.MathUtils.degToRad(az), e = THREE.MathUtils.degToRad(el), r = 120;
  gunes.position.set(Math.sin(a) * Math.cos(e) * r, Math.sin(e) * r, -Math.cos(a) * Math.cos(e) * r);
  gunes.target.position.set(0, 0, 0);
}

// --- model
let model = null;
function modelKur(mod) {
  if (model) scene.remove(model);
  model = sahneKur(mod).kok; scene.add(model);
  // maket altındaki sonsuz zemin
}
const taban = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), new THREE.MeshStandardMaterial({ color: 0xeceae5, roughness: 1, envMapIntensity: 0.5 }));
taban.rotation.x = -Math.PI / 2; taban.position.y = -0.03; taban.receiveShadow = true; scene.add(taban);
scene.fog = new THREE.Fog(0xedeeee, 120, 380);
modelKur(MOD);

// --- kameralar
const persp = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.3, 3000);
const ortho = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 3000);
let camera = persp;
const controls = new OrbitControls(persp, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.495; controls.minDistance = 8; controls.maxDistance = 220;
controls.enabled = UI;

function orthoAyarla() {
  const asp = innerWidth / innerHeight, genis = 92, yuk = 54;
  let w = genis, h = genis / asp; if (h < yuk) { h = yuk; w = yuk * asp; }
  Object.assign(ortho, { left: -w / 2, right: w / 2, top: h / 2, bottom: -h / 2 });
  ortho.position.set(0, 120, 0); ortho.up.set(0, 0, -1); ortho.lookAt(0, 0, 0); ortho.updateProjectionMatrix();
}

let aktif = viewKey;
function gorunusSec(k) {
  aktif = k; const v = GORUNUS[k];
  gunesAyarla(v.gunes);
  gok.intensity = v.ortam ?? 0.35;
  if (v.ust) { orthoAyarla(); camera = ortho; controls.enabled = false; }
  else {
    camera = persp; persp.fov = v.fov; controls.target.set(...v.hedef);
    // dar/dikey ekranda yatay kadrajı korumak için kamerayı geri çek
    const k = THREE.MathUtils.clamp(Math.sqrt(1.6 / (innerWidth / innerHeight)), 1, 2.2);
    persp.position.set(...v.poz).sub(controls.target).multiplyScalar(k).add(controls.target);
    persp.lookAt(controls.target); persp.updateProjectionMatrix(); controls.enabled = UI; controls.update();
  }
  document.getElementById('altBaslik').textContent = 'Kütle çalışması · ' + v.ad;
  yazilariCevir();
  composerKur();
  for (const b of document.querySelectorAll('#arac [data-g]')) b.setAttribute('aria-pressed', String(b.dataset.g === k));
}

// sokak adlarını bakış yönünden okunacak şekilde çevir
function yazilariCevir() {
  const f = aktif === 'vaziyet' ? new THREE.Vector2(0, -1)
    : new THREE.Vector2(controls.target.x - persp.position.x, controls.target.z - persp.position.z).normalize();
  model.traverse(o => {
    if (o.name !== 'yazi') return;
    const t = o.userData.yaziAci, ust = new THREE.Vector2(-Math.sin(t), -Math.cos(t));
    o.rotation.y = ust.dot(f) >= 0 ? t : t + Math.PI;
  });
}

// --- son işlem (ortam kapatma)
let composer = null;
function composerKur() {
  if (!AO) { composer = null; return; }
  try {
    const dpr = renderer.getPixelRatio();
    composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const ao = new GTAOPass(scene, camera, innerWidth * dpr, innerHeight * dpr);
    ao.updateGtaoMaterial({ radius: 1.4, distanceExponent: 1.6, thickness: 1.5, scale: 1.15, samples: 16 });
    ao.blendIntensity = 1.0;
    composer.addPass(ao);
    composer.addPass(new OutputPass());
  } catch (e) { console.warn('AO kapalı', e); composer = null; AO = false; }
}

// --- kuzey oku ve etiketler
function ekran(v) { const p = v.clone().project(camera); return [(p.x + 1) / 2 * innerWidth, (1 - p.y) / 2 * innerHeight]; }
function kuzeyGuncelle() {
  const h = aktif === 'vaziyet' ? new THREE.Vector3() : controls.target.clone().setY(0);
  const [x0, y0] = ekran(h), [x1, y1] = ekran(h.clone().add(new THREE.Vector3(0, 0, -6)));
  const aci = Math.atan2(x1 - x0, -(y1 - y0)) * 180 / Math.PI;
  document.getElementById('kuzeyOk').setAttribute('transform', `rotate(${aci.toFixed(1)})`);
}
const etiketKatmani = document.getElementById('etiketler');
function etiketler() {
  etiketKatmani.innerHTML = '';
  const lej = document.getElementById('lejant');
  if (MOD !== 'diyagram') { lej.hidden = true; return; }
  lej.hidden = false;
  lej.innerHTML = `<div><i style="background:#f2d49b"></i>Konut katları · Zemin, 1. ve 2. kat</div>
    <div><i style="background:#a9b8c6"></i>Otopark katı · otopark, sığınak, ortak alan</div>
    <div><i style="background:#e0876a"></i>Dükkan bloğu · 94,50 m², h=4,50 m</div>
    <div class="not">Her normal katta 4 daire (2+1) · 3 kat · 12 daire<br>Kat yüksekliği 3,00 m · çatı parapeti 1,00 m</div>`;
  const E = etiketNoktalari();
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('width', innerWidth); svg.setAttribute('height', innerHeight); svg.style.position = 'absolute';
  etiketKatmani.appendChild(svg);
  const cizgi = (x1, y1, x2, y2) => {
    const l = document.createElementNS(svg.namespaceURI, 'line');
    Object.entries({ x1, y1, x2, y2, stroke: '#23262b', 'stroke-width': 1 }).forEach(([a, b]) => l.setAttribute(a, b));
    svg.appendChild(l);
    const c = document.createElementNS(svg.namespaceURI, 'circle');
    Object.entries({ cx: x1, cy: y1, r: 2.5, fill: '#23262b' }).forEach(([a, b]) => c.setAttribute(a, b));
    svg.appendChild(c);
  };
  const yazi = (x, y, html, sol) => {
    const d = document.createElement('div'); d.className = 'etiket';
    d.style.left = x + 'px'; d.style.top = y + 'px';
    d.style.transform = sol ? 'translate(-100%,-50%)' : 'translate(0,-50%)';
    d.style.padding = sol ? '0 8px 0 0' : '0 0 0 8px';
    d.innerHTML = html; etiketKatmani.appendChild(d);
  };
  for (const k of E.katlar) {
    const [x, y] = ekran(new THREE.Vector3(k.nokta.x, k.y, k.nokta.y));
    cizgi(x + 4, y, x + 64, y);
    yazi(x + 64, y, `<b>${k.ad}</b><span>${k.kot}</span>`, false);
  }
  const [dx, dy] = ekran(new THREE.Vector3(E.dukkan.x, KOT.dukkan + KOT.dukkanParapet, E.dukkan.y));
  cizgi(dx, dy, dx - 50, dy - 50);
  yazi(dx - 50, dy - 50, '<b>DÜKKAN</b><span>+4.50</span>', true);
}

// --- arayüz
if (UI) {
  document.body.classList.add('ui');
  const arac = document.getElementById('arac'); arac.hidden = false;
  for (const [k, v] of Object.entries(GORUNUS)) {
    if (k === 'diyagram') continue;
    const b = document.createElement('button'); b.dataset.g = k; b.textContent = v.ad.split(' · ')[0].replace(' kuşbakışı', '');
    b.onclick = () => { gorunusSec(k); }; arac.appendChild(b);
  }
  const m = document.createElement('button'); m.textContent = MOD === 'diyagram' ? 'Malzemeli görünüm' : 'Kullanım şeması';
  m.onclick = () => { const u = new URL(location.href); u.searchParams.set('mod', MOD === 'diyagram' ? 'render' : 'diyagram'); u.searchParams.delete('gorunus'); location.href = u; };
  arac.appendChild(m);
}

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  persp.aspect = innerWidth / innerHeight; persp.updateProjectionMatrix();
  if (aktif === 'vaziyet') orthoAyarla();
  composerKur();
});

gorunusSec(viewKey);
let kare = 0, etiketGerek = true;
controls.addEventListener('change', () => { etiketGerek = true; });
addEventListener('resize', () => { etiketGerek = true; });
function dongu() {
  // arayüzsüz (render) modda birkaç kareden sonra dur: ekran görüntüsü sabit kareden alınır
  if (UI || kare < 4) requestAnimationFrame(dongu);
  if (camera === persp) controls.update();
  if (composer) composer.render(); else renderer.render(scene, camera);
  kuzeyGuncelle();
  if (MOD === 'diyagram' && (etiketGerek || kare < 3)) { etiketler(); etiketGerek = false; }
  if (++kare === 4) window.__hazir = true;
}
etiketler();
dongu();
</script>
</body>
</html>
