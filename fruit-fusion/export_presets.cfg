; Fruit Fusion export presets (Godot 4.7.1 stable).
; Option names verified against the 4.7.1-stable sources
; (platform/ios/export/export_plugin.cpp, editor/export/editor_export_platform_apple_embedded.cpp)
; and the official ios.zip export template. See docs/ios/BUILD_AND_RELEASE.md.
;
; MUST CHANGE before any real build:
;   application/bundle_identifier  -> "com.example.fruitfusion" is a PLACEHOLDER. Replace it with the
;                                     reverse-DNS App ID you register at developer.apple.com.
;   application/app_store_team_id  -> intentionally EMPTY in the repository (never commit a team ID).
;                                     Godot 4.7.1 REFUSES to export the Xcode project while it is empty:
;                                     set it locally in the editor (Project > Export > iOS) or on a scratch copy.
;
; Godot comments are stripped when the editor re-saves this file; the docs keep the same information.

[preset.0]

name="iOS"
platform="iOS"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, tools/*, store/*, docs/*, *.md"
export_path=""
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
architectures/arm64=true
application/app_store_team_id=""
application/export_method_debug=1
application/code_sign_identity_debug=""
application/code_sign_identity_release=""
application/provisioning_profile_specifier_debug=""
application/provisioning_profile_specifier_release=""
application/export_method_release=0
application/bundle_identifier="com.example.fruitfusion"
application/signature=""
application/short_version="1.0.0"
application/version="1"
application/additional_plist_content=""
application/icon_interpolation=4
application/export_project_only=true
application/delete_old_export_files_unconditionally=false
application/targeted_device_family=0
application/min_ios_version="15.0"
modules/camera=false
entitlements/increased_memory_limit=false
entitlements/game_center=false
entitlements/push_notifications="Disabled"
entitlements/additional=""
capabilities/access_wifi=false
capabilities/performance_gaming_tier=false
capabilities/performance_a12=false
capabilities/additional=PackedStringArray()
shader_baker/enabled=false
user_data/accessible_from_files_app=false
user_data/accessible_from_itunes_sharing=false
privacy/camera_usage_description=""
privacy/camera_usage_description_localized={}
privacy/microphone_usage_description=""
privacy/microphone_usage_description_localized={}
privacy/photolibrary_usage_description=""
privacy/photolibrary_usage_description_localized={}
privacy/file_timestamp_access_reasons=3
privacy/system_boot_time_access_reasons=1
privacy/disk_space_access_reasons=3
privacy/active_keyboard_access_reasons=0
privacy/user_defaults_access_reasons=0
privacy/tracking_enabled=false
privacy/tracking_domains=PackedStringArray()
icons/icon_1024x1024="res://assets/icon/icon_1024.png"
icons/icon_1024x1024_dark=""
icons/icon_1024x1024_tinted=""
storyboard/image_scale_mode=1
storyboard/custom_image@2x=""
storyboard/custom_image@3x=""
storyboard/use_custom_bg_color=true
storyboard/custom_bg_color=Color(0.99215686, 0.9490196, 0.87058824, 1)
